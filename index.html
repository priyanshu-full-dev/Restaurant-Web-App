<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Havmor Restaurant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar px-3">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <h5 class="m-0">🍴 Havmor Restaurant</h5>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <div class="menu-container">

    <!-- MENU -->
    <div class="menu-list">
      <div class="mb-3 text-center d-flex flex-wrap justify-content-center gap-2">
        <button class="btn btn-outline-primary category-btn active" data-category="all">All</button>
        <button class="btn btn-outline-primary category-btn" data-category="breakfast">Breakfast</button>
        <button class="btn btn-outline-primary category-btn" data-category="lunch">Lunch</button>
        <button class="btn btn-outline-primary category-btn" data-category="dinner">Dinner</button>
        <button class="btn btn-outline-primary category-btn" data-category="snacks">Snacks</button>
        <button class="btn btn-outline-primary category-btn" data-category="dessert">Desserts</button>
      </div>
      <div class="row g-3" id="menuGrid"></div>
    </div>

    <!-- CART TOGGLE BUTTON FOR MOBILE -->
    <button id="cartToggleBtn" class="btn btn-primary d-lg-none position-fixed" 
            style="bottom:20px; right:20px; z-index:1050;">
      <i class="bi bi-cart3"></i> <span id="cartCount">0</span>
    </button>

    <!-- ORDER SECTION -->
    <div class="order-section" id="orderSection">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="m-0">🧾 Order Summary</h5>
        <button id="closeOrderBtn" class="btn btn-danger btn-sm">&times;</button>
      </div>

      <!-- Order Type -->
      <div class="mb-3">
        <label class="form-label fw-bold">Order Type:</label>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-success" id="dineInBtn">Dine-in</button>
          <button class="btn btn-outline-warning" id="takeawayBtn">Takeaway</button>
        </div>
      </div>

      <!-- Table Selection -->
      <div id="tableSection" style="display:none;">
        <h6>Select Table:</h6>
        <div id="tableGrid" class="d-flex flex-wrap"></div>
      </div>

      <div id="orderList"></div>
      <div class="total mt-3">Total: ₹<span id="totalAmount">0</span></div>
      <button class="btn btn-primary mt-3" id="proceedOrderBtn" style="display:none;">Proceed Order</button>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
